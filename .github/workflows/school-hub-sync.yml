name: Sync Schoology to Notion

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install --omit=dev --no-fund

      - name: Sync Schoology and Notion
        run: npm start
        env:
          SCHOOLOGY_CONSUMER_KEY: ${{ secrets.SCHOOLOGY_CONSUMER_KEY }}
          SCHOOLOGY_CONSUMER_SECRET: ${{ secrets.SCHOOLOGY_CONSUMER_SECRET }}
          SCHOOLOGY_USER_ID: ${{ secrets.SCHOOLOGY_USER_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TASKS_DATA_SOURCE_ID: 5df85cc6-c5e6-4290-98c2-10101ad9caae
          NOTION_SCHOOLOGY_INBOX_DATA_SOURCE_ID: ee194a84-b759-4068-b093-88cb93a5013a
          NOTION_GRADES_DATA_SOURCE_ID: c54af276-c7c2-420e-8a5f-ad034d5e12e0
          NOTION_VERSION: "2025-09-03"
          ASSIGNMENT_LOOKBACK_DAYS: "2"
          ASSIGNMENT_LOOKAHEAD_DAYS: "30"
          SECTION_SUBJECT_MAP_JSON: ${{ secrets.SECTION_SUBJECT_MAP_JSON }}
